<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- img-src can't be an allowlist here: note previews, Todoist descriptions
         and Reader feed thumbnails show images from any host, so it is https:
         (the Assistant tab relies on renderMarkdown's remoteImages: false
         instead — see CLAUDE.md). The rest still holds: no remote scripts, no
         renderer fetch beyond the app itself, no frames, objects or forms. Dev
         relaxes script-src and connect-src for Vite (electron.vite.config.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Command Center</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
